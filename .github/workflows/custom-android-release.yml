# Personal build of the Android keyboard (package com.zeroconvert.ime.custom).
#
# On each push or manual run it takes the latest upstream release into the custom branch, builds
# the APK with the official native engine and models from that release
# (scripts/custom/use-official-native.sh), and publishes it as a release of this fork.
#
# Setup (once, in this fork):
#   - Actions enabled.
#   - Secret DEBUG_KEYSTORE_BASE64 = base64 of the debug.keystore that signed the installed app.
#     Updates only install over the existing app when every build uses this same key.
#
# A merge conflict, or an upstream change to .github/workflows (which the workflow token may
# not push), stops the run; resolve it by hand and push.
name: Custom Android build

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: custom-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM: g0083/ZeroConvert-IME
      BRANCH: master
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Take in the latest upstream release
        id: base
        run: |
          # Upstream also publishes model and dictionary releases (models-v*, dictionary-v*);
          # only the app releases (v*) carry the APK and native engine this build reuses.
          tag=$(gh api "repos/$UPSTREAM/releases?per_page=50" \
            -q '[.[] | select((.draft or .prerelease) | not) | .tag_name | select(test("^v[0-9]"))][0] // empty')
          if [ -z "$tag" ]; then
            echo "::error::No upstream app release (v*) found."
            exit 1
          fi
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$tag:refs/tags/$tag"
          if ! git merge-base --is-ancestor "$tag" HEAD; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge --no-edit "$tag"
            git push origin "HEAD:$BRANCH"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$tag-custom-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Skip when this commit is already released
        id: check
        env:
          RELEASE: ${{ steps.base.outputs.release }}
        run: |
          if gh release view "$RELEASE" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$RELEASE is already published."
          fi

      - name: Restore the signing key
        if: steps.check.outputs.skip != 'true'
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 is not set; a new key would break updates."
            exit 1
          fi
          # Point the Android Gradle plugin at this directory explicitly: the first published
          # build was signed with another key although ~/.android/debug.keystore was restored.
          key_home="$RUNNER_TEMP/android-user-home"
          mkdir -p "$key_home"
          echo "$KEYSTORE" | base64 -d > "$key_home/debug.keystore"
          echo "ANDROID_USER_HOME=$key_home" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        if: steps.check.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Use the official native engine and models
        if: steps.check.outputs.skip != 'true'
        run: bash scripts/custom/use-official-native.sh "${{ steps.base.outputs.tag }}"

      - name: Test, lint and build
        if: steps.check.outputs.skip != 'true'
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :rebuilt:testDebugUnitTest :rebuilt:lintDebug :rebuilt:assembleDebug -x verifySharedEngine

      - name: Check the APK is signed with the installed app's key
        if: steps.check.outputs.skip != 'true'
        env:
          # Certificate (public) fingerprint of the key that signed the app on the phone.
          expected: 4833038733d279837b785cac7cd76e63c2558abbd3f666532329092d848631fe
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          actual=$("$apksigner" verify --print-certs android/rebuilt/build/outputs/apk/debug/rebuilt-arm64-v8a-debug.apk \
            | awk '/certificate SHA-256 digest:/ { print $NF; exit }')
          echo "expected=$expected actual=$actual"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::The APK is not signed with the installed app's key; it would not update the app."
            exit 1
          fi

      - name: Publish the APK
        if: steps.check.outputs.skip != 'true'
        env:
          RELEASE: ${{ steps.base.outputs.release }}
          TAG: ${{ steps.base.outputs.tag }}
        run: |
          apk="ZeroConvert-IME-$RELEASE-arm64.apk"
          cp android/rebuilt/build/outputs/apk/debug/rebuilt-arm64-v8a-debug.apk "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
          gh release create "$RELEASE" "$apk" SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "$RELEASE" \
            --notes "本家 $TAG をもとにしたカスタム版（com.zeroconvert.ime.custom、arm64）。コミット $(git rev-parse --short HEAD)。"
